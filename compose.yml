services:
  webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports: ["3000:80"]
    # profiles: ["all"]
    container_name: frontend

  webapi:
    ports: [5000:80]
    # profiles: ["all"]
    networks: [network]
    container_name: backend
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=cadastro_db;User=sa;Password=PassW0rd@123;TrustServerCertificate=True;
      - ConnectionStrings__H2=-Host=localhost;Port=1521;Database=testdb;Username=sa;Password=123
    depends_on:
      sqlserver: { condition: service_healthy }

  # TODO: migrar para h2
  # h2:
  #   image: oscarfonts/h2
  #   container_name: h2
  #   ports: [8082:8082, 1521:1521]
  #   environment:
  #     - H2_OPTIONS=-ifNotExists -tcp -tcpAllowOthers -web -webAllowOthers -user sa -password 123
  #   command: >
  #     java -jar h2*.jar
  #     -tcp -tcpAllowOthers -ifNotExists
  #     -web -webAllowOthers
  #     -tcpPort 1521
  #     -baseDir /opt/h2-data
  #   volumes: [h2data:/opt/h2-data]
  #   restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    volumes: [db:/var/opt/mssql]
    container_name: database
    networks: [network]
    ports: [1433:1433]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'PassW0rd@123' -Q 'SELECT 1'",
        ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=PassW0rd@123

networks:
  network: { driver: bridge }

volumes:
  db: { driver: local }
  h2: { driver: local }
